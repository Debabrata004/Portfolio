<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Minimal personal portfolio navigation" />
  <title>Portfolio Navbar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="ani.css">

<script src="header-loader.js" defer></script>

</head>

<body>
  <div id="site-header"></div>

  <!-- Futuristic Portfolio Intro -->
<div class="portfolio-intro" id="portfolioIntro">
    <div class="intro-grid"></div>
    <div class="intro-glow"></div>

    <div class="intro-content">
        <div class="intro-orbit orbit-one"></div>
        <div class="intro-orbit orbit-two"></div>

        <div class="intro-image-wrap">
            <div class="image-scanner"></div>
            <img src="dk.jpeg" alt="My Profile" class="intro-image">
        </div>

        <div class="intro-label">
            <span class="status-dot"></span>
            SYSTEM INITIALIZED
        </div>

        <h1 class="intro-title">
            <span>WELCOME TO</span>
            <strong>MY <em>PORTFOLIO</em></strong>
        </h1>

        <p class="intro-subtitle">
            CREATIVITY <span>×</span> CODE <span>×</span> INNOVATION
        </p>

        <div class="intro-progress">
            <div class="intro-progress-fill"></div>
        </div>

        <div class="intro-loading">
            <span>INITIALIZING EXPERIENCE</span>
            <span class="loading-percent">100%</span>
        </div>
    </div>

    <div class="intro-corner corner-tl"></div>
    <div class="intro-corner corner-tr"></div>
    <div class="intro-corner corner-bl"></div>
    <div class="intro-corner corner-br"></div>
</div>
</body>

</html>
